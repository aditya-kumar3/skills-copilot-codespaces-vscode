version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: resume-ats-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: resume-ats-checker
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: resume-ats-backend
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/resume-ats-checker
      JWT_SECRET: your_jwt_secret_key
      NODE_ENV: development
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
